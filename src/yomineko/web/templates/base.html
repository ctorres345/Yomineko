<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}yomineko{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/" class="brand"><strong>yomineko</strong> <span lang="ja">読み猫</span></a></li></ul>
      {% if can_quit %}
      <ul><li><form method="post" action="/quit"><button type="submit" class="secondary quiet">Quit yomineko</button></form></li></ul>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% if steps %}{% include "_steps.html" %}{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <small>yomineko {{ version }}. Everything runs on this computer; nothing is uploaded.
    Word meanings come from JMdict, &copy; EDRDG, CC BY-SA 4.0.</small>
  </footer>
</body>
</html>
