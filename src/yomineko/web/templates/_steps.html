{# The step bar on a game's pages: done steps show a check, the current one is filled. #}
<nav aria-label="Steps" class="steps">
  <ol>
    {% for s in steps %}
    <li>
      <a href="{{ s.href }}" class="step {{ s.state }}"{% if s.state == "current" %} aria-current="step"{% endif %}>
        <span class="dot {{ s.state }}">{% if s.state == "done" %}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr-only">Done:</span>{% else %}{{ s.number }}{% endif %}</span>
        <span><span class="name">{{ s.name }}</span>{% if s.note %}<small class="note">{{ s.note }}</small>{% endif %}</span>
      </a>
    </li>
    {% endfor %}
  </ol>
</nav>
